		<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Orleans Map</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Light theme */
        body.light-mode {
            background-color: #ffffff;
            color: #000000;
        }

        /* Dark theme */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

        .container {
            margin-top: 50px;
        }

        /* Roulette table styling */
        #roulette-table {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border-radius: 50%;
            background-color: green;
            border: 5px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Circle of numbers around the table */
        #roulette-table div {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            font-weight: bold;
        }

        /* Numbers placed around the circle */
        .number {
            transform-origin: 150px;
        }

        /* Animation for table spinning */
        .spin-table {
            animation: spinTable 3s ease-out forwards;
        }

        @keyframes spinTable {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(1440deg); /* 4 full spins */
            }
        }

        /* Ball rolling animation */
        #ball {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            z-index: 1;
            animation: rollBall 3s ease-out forwards;
        }

        @keyframes rollBall {
            0% {
                transform: rotate(0deg) translate(0px);
            }
            100% {
                transform: rotate(1440deg) translate(150px); /* Simulate ball rolling */
            }
        }

        /* Style for results table */
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 10px;
            text-align: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #spin-button, #reset-button, #theme-toggle {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }

        /* Light mode button background */
        body.light-mode #spin-button, body.light-mode #reset-button, body.light-mode #theme-toggle {
            background-color: #ddd;
            color: #000;
        }

        /* Dark mode button background */
        body.dark-mode #spin-button, body.dark-mode #reset-button, body.dark-mode #theme-toggle {
            background-color: #444;
            color: #fff;
        }

        #spin-result {
            margin-top: 20px;
            font-size: 24px;
        }
    </style>
</head>
<body>
<iframe src="https://www.google.com/maps/d/u/0/embed?mid=10XAHRqrQms78jdre4TBIxncGPhMqxXY&ehbc=2E312F&noprof=1" width="1920" height="1080"></iframe>
</body>
</html>
